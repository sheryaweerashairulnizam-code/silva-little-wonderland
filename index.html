<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f326f" />
  <title>Silva's Little Wonderland</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="snow-layer" aria-hidden="true"></div>
    <div class="sparkle-layer" aria-hidden="true"></div>
    <header id="topbar" class="topbar hidden">
      <button id="backBtn" class="icon-btn" aria-label="Kembali">← <span>Back</span></button>
      <button id="homeBtn" class="brand-mini" aria-label="Home"><span class="brand-dot">✦</span> Silva's Wonderland</button>
      <div class="top-actions">
        <div class="progress-chip" title="Progress perjalanan"><span>✧</span><b id="progressCount">0</b><small>/ 7</small></div>
        <button id="musicBtn" class="icon-btn" aria-label="Musik">♫ <span>Music</span></button>
        <button id="menuBtn" class="icon-btn" aria-label="Buka menu">☰</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <aside id="musicPanel" class="music-panel" aria-hidden="true">
      <div class="panel-head"><h3>♫ Lagu untuk Silva</h3><button class="close-panel" data-close-panel>×</button></div>
      <p id="musicName" class="muted">Belum ada lagu. Upload MP3 pilihanmu ya ♡</p>
      <div class="music-actions">
        <button id="playMusicBtn" class="pill-btn">▶ Play</button>
        <button id="pauseMusicBtn" class="pill-btn ghost">Ⅱ Pause</button>
        <button id="musicToggleBtn" class="pill-btn ghost">Music ON</button>
      </div>
      <label class="volume-label">Volume <input id="volumeControl" type="range" min="0" max="1" step="0.05" value="0.7" /></label>
      <div class="upload-row">
        <label class="pill-btn upload-btn">↥ Upload / Replace Music<input id="musicInput" type="file" accept="audio/mpeg,audio/mp3,audio/*" /></label>
        <button id="removeMusicBtn" class="text-btn">Remove Music</button>
      </div>
      <div id="autoplayPrompt" class="autoplay-prompt hidden"><span>♪</span><span>A little song is waiting for you ♡</span><button id="tapPlayBtn" class="pill-btn">Tap to Play Music</button></div>
    </aside>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card" id="modalCard"></div>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
